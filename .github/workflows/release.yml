name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

# Allow one concurrent release
concurrency:
  group: 'release'
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Pull static assets
        run: npm run assets:pull
      - run: npm run build
      # @semantic-release/npm ships with semantic-release, @semantic-release/git does not
      - name: Install semantic-release
        run: |
          npm install --no-save semantic-release conventional-changelog-conventionalcommits @semantic-release/git
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
